name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tap-syntax:
    name: Tap syntax (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew on Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      - name: Tap local checkout
        run: brew tap asymptote-labs/tap "$GITHUB_WORKSPACE"

      - name: Validate tap formula loading
        run: brew readall asymptote-labs/tap

      - name: Audit Beacon Vector mirror
        run: brew audit --strict --online asymptote-labs/tap/beacon-vector
